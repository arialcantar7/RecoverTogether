{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | RecoverTogether</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <main class="container">
        <section class="create-post">
            <h1>Welcome Back</h1>
            <p>Log in to your RecoverTogether account.</p>

            {% if form.errors %}
                <p>Your username or password is incorrect.</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log In</button>
            </form>

            <p>Don't have an account?
                <a href="{% url 'register' %}">Create one</a>
            </p>
            <a href="{% url 'home' %}">Back to Home</a>
        </section>
    </main>
</body>
</html>
